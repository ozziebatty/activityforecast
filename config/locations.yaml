# --- coastal (Sydney and nearby) ---------------------------------------

- name: Royal National Park (Bundeena/Wattamolla)
  lat: -34.0765
  lon: 151.1517
  marine: true
  pollution_advisory: false
  whale_watching: true
  park_alert_match: ["Royal National Park"]
  activities:
    hiking: {}
    kayaking_sea: {}

- name: Manly Beach
  lat: -33.7969
  lon: 151.2882
  marine: true
  pollution_advisory: false
  whale_watching: true
  activities:
    surfing:
      time_window: {start: 6, end: 10}
      offshore_directions: [{from: 225, to: 275}]   # beach faces NE - SW/W is offshore

- name: Bondi Beach
  lat: -33.8908
  lon: 151.2743
  marine: true
  pollution_advisory: false
  whale_watching: true
  activities:
    surfing:
      time_window: {start: 6, end: 10}
      offshore_directions: [{from: 250, to: 290}]   # beach faces E/ENE - W is offshore

- name: Gordons Bay (Coogee)
  lat: -33.9187
  lon: 151.2649
  marine: true
  pollution_advisory: false
  whale_watching: true
  tide_notes: null
  activities:
    scuba:
      time_window: {start: 8, end: 15}

- name: Cronulla / Wanda Beach
  lat: -34.0287
  lon: 151.1547
  marine: true
  pollution_advisory: false
  whale_watching: true
  tide_notes: null
  activities:
    surfing:
      time_window: {start: 6, end: 10}
      offshore_directions: [{from: 280, to: 330}]   # beach faces E/SE - W/NW is offshore
    kitesurfing:
      time_window: {start: 11, end: 16}
      offshore_directions: [{from: 280, to: 330}]
    kayaking_sea: {}

- name: Yarra Bay, Botany Bay (Kurnell)
  lat: -33.9762
  lon: 151.2270
  marine: true
  activities:
    kitesurfing:
      time_window: {start: 11, end: 16}
      offshore_directions: [{from: 200, to: 280}]   # sheltered bay - unsafe direction blows away from shore, out into the bay
    kayaking_freshwater: {}   # sheltered bay - flat-water profile, not a literal freshwater body

- name: Sydney Harbour (Rose Bay)
  lat: -33.8688
  lon: 151.2711
  activities:
    kayaking_freshwater: {}

- name: RANSA (Rushcutters Bay)
  lat: -33.8735
  lon: 151.2350
  activities:
    sailing: {}

- name: Sydney CBD
  lat: -33.8688
  lon: 151.2093
  activities:
    city_touring: {}

- name: Jervis Bay (Hyams Beach)
  lat: -35.0997
  lon: 150.7086
  marine: true
  pollution_advisory: false
  whale_watching: true
  park_alert_match: ["Jervis Bay National Park"]
  activities:
    kayaking_sea: {}
    snorkelling:
      time_window: {start: 9, end: 15}
    scuba:
      time_window: {start: 8, end: 15}
    hiking: {}

