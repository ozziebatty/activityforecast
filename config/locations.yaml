# Places to check. Add a new spot by copying a block below - no code
# changes needed, main.py picks up anything listed here automatically.
#
# Fields:
#   name                 display name
#   lat / lon            coordinates (decimal degrees)
#   marine               true if this spot needs wave/swell/sea-temp data
#                        (coastal/ocean activities). Leave off for
#                        inland/sheltered spots to skip that API call.
#   pollution_advisory   true/false - there's no reliable free live feed for
#                        NSW Beachwatch water-quality advisories (the old
#                        bulletin endpoints have been retired in favour of a
#                        JS-only site with no documented API), so this is a
#                        manual flag: check beachwatch.nsw.gov.au yourself
#                        and flip it if a beach has an active advisory.
#   tide_notes           free text, informational only (not scored) - fill
#                        in once you know a break's tide preference. There's
#                        no free live NSW tide API either, so this isn't
#                        wired into scoring - a placeholder for you (or a
#                        future data source) to use.
#   whale_watching       true only at spots that actually look out over open
#                        coastal water migrating whales would pass (May-Nov).
#                        Drives the whale-season bonus in activities.yaml -
#                        deliberately NOT set on inland spots like the Blue
#                        Mountains just because they also have a "hiking"
#                        activity in season.
#   park_alert_match     list of NSW NPWS park names to match against the
#                        live nationalparks.nsw.gov.au alerts feed
#                        (closures/advisories) - shown as an informational
#                        banner, never a scoring gate: the feed matches at
#                        whole-park level, and a park can span hundreds of
#                        square km, so an alert elsewhere in the park may
#                        have nothing to do with this specific spot - check
#                        it yourself. Only set this for spots actually
#                        inside an NPWS-managed reserve (skip beaches/
#                        harbours that aren't park land, and Commonwealth
#                        parks like Booderee, which NPWS's feed doesn't
#                        cover). Must match the park's exact name as it
#                        appears in the feed (it's matched as a prefix).
#   activities           dict of activity-key -> params. The activity key
#                        must match a block in activities.yaml (kayaking has
#                        two profiles - kayaking_sea and kayaking_freshwater
#                        - pick whichever suits the water body). Params:
#                          time_window: {start, end}   overrides the
#                              activity's default window for this spot.
#                          offshore_directions: [{from, to}, ...]  compass
#                              sectors (0-360) for wind blowing from land to
#                              sea here - used as a "clean wave" bonus for
#                              surfing and a hard safety gate for
#                              kitesurfing. These are rough approximations
#                              of each beach's orientation, NOT verified
#                              local/safety knowledge - correct them before
#                              relying on the kitesurfing gate for real
#                              safety decisions.

