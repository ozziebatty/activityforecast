# Places to check. Add a new spot by copying a block below - no code
# changes needed, main.py picks up anything listed here automatically.
#
# Fields:
#   name                 display name
#   lat / lon            coordinates (decimal degrees)
#   marine               true if this spot needs wave/swell/sea-temp data
#                        (coastal/ocean activities). Leave off for
#                        inland/sheltered spots to skip that API call.
#   pollution_advisory   true/false - there's no reliable free live feed for
#                        NSW Beachwatch water-quality advisories (the old
#                        bulletin endpoints have been retired in favour of a
#                        JS-only site with no documented API), so this is a
#                        manual flag: check beachwatch.nsw.gov.au yourself
#                        and flip it if a beach has an active advisory.
#   tide_notes           free text, informational only (not scored) - fill
#                        in once you know a break's tide preference. There's
#                        no free live NSW tide API either, so this isn't
#                        wired into scoring - a placeholder for you (or a
#                        future data source) to use.
#   whale_watching       true only at spots that actually look out over open
#                        coastal water migrating whales would pass (May-Nov).
#                        Drives the whale-season bonus in activities.yaml -
#                        deliberately NOT set on inland spots like the Blue
#                        Mountains just because they also have a "hiking"
#                        activity in season.
#   requires_driving     true if this spot isn't practically reachable from
#                        Sydney by train/bus/ferry (remote national parks with
#                        no service, or a beach town with no direct public
#                        transport) - a car is the only realistic way to get
#                        there. Drives the report's "Driving" checkbox: left
#                        unticked (the default) these spots are hidden, since
#                        most day-trip planning is public-transport-first.
#                        Leave unset (defaults false) for anywhere with a
#                        train/bus/ferry that gets you there directly.
#   park_alert_match     list of NSW NPWS park names to match against the
#                        live nationalparks.nsw.gov.au alerts feed
#                        (closures/advisories) - shown as an informational
#                        banner, never a scoring gate: the feed matches at
#                        whole-park level, and a park can span hundreds of
#                        square km, so an alert elsewhere in the park may
#                        have nothing to do with this specific spot - check
#                        it yourself. Only set this for spots actually
#                        inside an NPWS-managed reserve (skip beaches/
#                        harbours that aren't park land, and Commonwealth
#                        parks like Booderee, which NPWS's feed doesn't
#                        cover). Must match the park's exact name as it
#                        appears in the feed (it's matched as a prefix).
#   activities           dict of activity-key -> params. The activity key
#                        must match a block in activities.yaml (kayaking has
#                        two profiles - kayaking_sea and kayaking_freshwater
#                        - pick whichever suits the water body). Params:
#                          time_window: {start, end}   overrides the
#                              activity's default window for this spot.
#                          offshore_directions: [{from, to}, ...]  compass
#                              sectors (0-360) for wind blowing from land to
#                              sea here - used as a "clean wave" bonus for
#                              surfing and a hard safety gate for
#                              kitesurfing. These are rough approximations
#                              of each beach's orientation, NOT verified
#                              local/safety knowledge - correct them before
#                              relying on the kitesurfing gate for real
#                              safety decisions.

# --- climbing / hiking (inland) ----------------------------------------

- name: Blue Mountains (Katoomba)
  lat: -33.7128
  lon: 150.3119
  park_alert_match: ["Blue Mountains National Park"]
  activities:
    climbing: {}
    hiking: {}

- name: Nowra (Shoalhaven Gorge)
  lat: -34.8770
  lon: 150.6020
  requires_driving: true   # nearest station (Bomaderry) doesn't reach the gorge itself
  activities:
    climbing: {}

- name: Wollemi National Park (Newnes/Glow Worm Tunnel)
  lat: -33.4650
  lon: 150.2280
  park_alert_match: ["Wollemi National Park"]
  requires_driving: true   # remote, unsealed roads - no public transport
  activities:
    hiking: {}

- name: Ku-ring-gai Chase National Park (Bobbin Head)
  lat: -33.6560
  lon: 151.1630
  park_alert_match: ["Ku-ring-gai Chase National Park"]
  activities:
    hiking: {}
    kayaking_freshwater: {}   # Cowan Creek at Bobbin Head - sheltered tidal estuary,
                              # flat-water profile rather than open-coast kayaking_sea

# --- coastal (Sydney and nearby) ---------------------------------------

- name: Royal National Park (Bundeena/Wattamolla)
  lat: -34.0765
  lon: 151.1517
  marine: true
  pollution_advisory: false
  whale_watching: true
  park_alert_match: ["Royal National Park"]
  activities:
    hiking: {}
    kayaking_sea: {}

- name: Manly Beach
  lat: -33.7969
  lon: 151.2882
  marine: true
  pollution_advisory: false
  whale_watching: true
  activities:
    surfing:
      offshore_directions: [{from: 225, to: 275}]   # beach faces NE - SW/W is offshore
    # beach_day archived - see config/archive/locations.yaml

- name: Bondi Beach
  lat: -33.8908
  lon: 151.2743
  marine: true
  pollution_advisory: false
  whale_watching: true
  activities:
    surfing:
      offshore_directions: [{from: 250, to: 290}]   # beach faces E/ENE - W is offshore
    beach_day: {}

- name: Gordons Bay (Coogee)
  lat: -33.9187
  lon: 151.2649
  marine: true
  pollution_advisory: false
  whale_watching: true
  tide_notes: null
  activities:
    snorkelling:
      time_window: {start: 9, end: 15}
    scuba:
      time_window: {start: 8, end: 15}

- name: Macquarie Lighthouse (South Head)
  lat: -33.8207
  lon: 151.2831
  marine: true
  whale_watching: true
  activities:
    whale_watching_boat: {}   # tours actually cruise the coast, not moored at the lighthouse -
                              # this headland is just the weather reference point for that stretch

- name: Long Reef (Fisherman's Beach)
  lat: -33.7375
  lon: 151.3015
  marine: true
  pollution_advisory: false
  activities:
    kitesurfing:
      time_window: {start: 11, end: 16}
      # UNVERIFIED - check before trusting the kitesurfing gate here. Fisherman's Beach sits on
      # the south side of the Long Reef peninsula with the golf course headland to its north, so
      # land-to-water here is northerly, not the westerly that applies on the open east-facing
      # beaches (Manly/Bondi/Cronulla). Narrowed from an initial 340-60 to clear the NE sea
      # breeze, which is the wind the spot is normally kited in - this now flags only true
      # N/NNW-through-NNE land-to-water days, not a cross-onshore nor'easter.
      offshore_directions: [{from: 340, to: 30}]
    kite_practice: {}   # wide flat sand at the launch - trainer-kite ground at the same spot

- name: Cronulla / Wanda Beach
  lat: -34.0287
  lon: 151.1547
  marine: true
  pollution_advisory: false
  whale_watching: true
  tide_notes: null
  activities:
    surfing:
      offshore_directions: [{from: 280, to: 330}]   # beach faces E/SE - W/NW is offshore
    kitesurfing:
      time_window: {start: 11, end: 16}
      offshore_directions: [{from: 280, to: 330}]
    kite_practice: {}   # wide open beach, consistently windy - good trainer-kite ground before rigging a full kite
    # kayaking_sea, beach_day archived - see config/archive/locations.yaml

- name: Yarra Bay, Botany Bay (Kurnell)
  lat: -33.9762
  lon: 151.2270
  marine: true
  activities:
    kitesurfing:
      time_window: {start: 11, end: 16}
      offshore_directions: [{from: 200, to: 280}]   # sheltered bay - unsafe direction blows away from shore, out into the bay
    # kite_practice, kayaking_freshwater archived - see config/archive/locations.yaml

- name: Wollongong (North Beach)
  lat: -34.4139
  lon: 150.9006
  marine: true
  pollution_advisory: false
  requires_driving: true   # flagged drive-only at your request (there is a South Coast Line
                           # train to Wollongong station) - unset this to have it show by default
  activities:
    kitesurfing:
      time_window: {start: 11, end: 16}
      offshore_directions: [{from: 250, to: 300}]   # open east-facing beach - W is offshore

- name: Sydney CBD
  lat: -33.8688
  lon: 151.2093
  activities:
    city_touring: {}

- name: Parramatta Park
  lat: -33.8149
  lon: 151.0011
  activities:
    kite_practice: {}   # large open riverside parkland - room to fly a trainer kite with no water/board involved

- name: Parramatta River
  lat: -33.8149
  lon: 151.0011
  activities:
    kayaking_freshwater: {}   # flat, sheltered urban river - easy paddling, no marine data needed

- name: Jervis Bay (Hyams Beach)
  lat: -35.0997
  lon: 150.7086
  marine: true
  pollution_advisory: false
  whale_watching: true
  park_alert_match: ["Jervis Bay National Park"]
  requires_driving: true   # no train, no practical direct public transport from Sydney
  activities:
    kayaking_sea: {}
    beach_day: {}
    # snorkelling, scuba, hiking archived - see config/archive/locations.yaml
